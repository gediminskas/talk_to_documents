# Append these sections to your existing pyproject.toml (keep your [project] and
# [build-system] sections as they are).

[tool.pytest.ini_options]
testpaths = ['tests']
markers = [
    'integration: needs the Postgres container (make up)',
    'model: downloads and runs the real embedding model (slow)',
]
addopts = "-m 'not integration and not model'"

[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B']

[tool.ruff.format]
quote-style = 'single'
