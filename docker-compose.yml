services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ttd
      POSTGRES_PASSWORD: ttd
      POSTGRES_DB: ttd
    ports: ['5433:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ttd -d ttd']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: