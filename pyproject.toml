[project]
name = "talk_to_documents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrius Gediminskas", email = "gediminskas@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.9.1",
    "openai>=3.46.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
    "rich>=15.0.0",
    "tokenizers>=0.23.3",
    "typer>=0.27.3",
]

[project.scripts]
ttd = "talk_to_documents.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ['tests']
markers = [
    'integration: needs the Postgres container (make up)',
    'model: downloads and runs the real embedding model (slow)',
]
addopts = "-m 'not integration and not model'"

[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B']

[tool.ruff.format]
quote-style = 'single'
